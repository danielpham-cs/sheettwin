[project]
name = "sheetir"
version = "0.1.0"
description = "SheetIR: parse an Excel workbook into a queryable intermediate representation (SheetTwin PoC)"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "xlrd>=2.0"]

[project.scripts]
sheetir = "sheetir.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "xlwt>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sheetir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
